version: '3.8'

services:
  thai-ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thai-ocr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./app/training/models:/app/app/training/models
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Bangkok
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/app/training/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

